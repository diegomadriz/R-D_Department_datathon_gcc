# Databricks Asset Bundle del proyecto (ADR 0003).
#
# Cada integrante despliega en su propia cuenta con su perfil del CLI:
#   databricks bundle validate -t <integrante> -p <perfil>
#   databricks bundle deploy   -t <integrante> -p <perfil>
#   databricks bundle run gcc_end_to_end -t <integrante> -p <perfil>
# El host y las credenciales viven solo en el archivo de perfiles del CLI, nunca aquí (ADR 0001).

bundle:
  name: gcc_strength

variables:
  experiment_path:
    description: Experimento de MLflow del workspace para EDA, train, replay y registro.
    default: /Workspace/Users/${workspace.current_user.userName}/gcc_strength
  catalog:
    description: Catálogo de Unity Catalog del proyecto (se crea con SQL en el bootstrap).
    default: datathon
  schema:
    description: Esquema del reto GCC.
    default: gcc

# Solo se sincroniza lo que el job necesita. `src/` se importa desde estos archivos
# (sys.path), sin construir un wheel (ADR 0004).
sync:
  paths:
    - ./src
    - ./notebooks
    - ./conf
    - ./data

resources:
  jobs:
    gcc_end_to_end:
      name: gcc_end_to_end
      description: Medallón, EDA, entrenamiento auditado, replay verificado, campeón UC y tablas Gold.
      max_concurrent_runs: 1
      tags:
        project: gcc_strength
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: bundle_root
          default: ${workspace.file_path}
        - name: run_id
          default: "{{job.run_id}}"
        - name: train_mode
          default: full
        - name: lockbox_mode
          default: replay
        - name: experiment_path
          default: ${var.experiment_path}
      environments:
        - environment_key: medallion
          spec:
            environment_version: "6"
            dependencies:
              # Ya viene en el entorno 6; se fija para que un cambio de entorno falle a la vista.
              - pyyaml==6.0.3
        - environment_key: ml
          spec:
            environment_version: "6"
            dependencies:
              # Env 6 ya incluye mlflow-skinny 3.12.0; no se instala mlflow completo.
              - lightgbm==4.6.0
              - shap==0.51.0
              - statsmodels==0.14.5
              - pyyaml==6.0.3
      tasks:
        - task_key: bootstrap
          environment_key: medallion
          notebook_task:
            notebook_path: ./notebooks/00_bootstrap.py
        - task_key: bronze
          depends_on:
            - task_key: bootstrap
          environment_key: medallion
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: medallion
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: medallion
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
        - task_key: reconcile
          depends_on:
            - task_key: gold
          environment_key: medallion
          notebook_task:
            notebook_path: ./notebooks/04_dq_reconcile.py
        - task_key: eda
          depends_on:
            - task_key: reconcile
          environment_key: ml
          notebook_task:
            notebook_path: ./notebooks/05_eda.py
        - task_key: train
          depends_on:
            - task_key: eda
          environment_key: ml
          notebook_task:
            notebook_path: ./notebooks/06_train.py
        - task_key: evaluate
          depends_on:
            - task_key: train
          environment_key: ml
          notebook_task:
            notebook_path: ./notebooks/07_evaluate.py
            base_parameters:
              train_run_id: "{{tasks.train.values.train_run_id}}"
        - task_key: register
          depends_on:
            - task_key: evaluate
          environment_key: ml
          notebook_task:
            notebook_path: ./notebooks/08_register.py
            base_parameters:
              train_run_id: "{{tasks.train.values.train_run_id}}"
              evaluate_run_id: "{{tasks.evaluate.values.evaluate_run_id}}"
        - task_key: publish
          depends_on:
            - task_key: register
          environment_key: ml
          notebook_task:
            notebook_path: ./notebooks/09_publish.py
            base_parameters:
              train_run_id: "{{tasks.train.values.train_run_id}}"
              evaluate_run_id: "{{tasks.evaluate.values.evaluate_run_id}}"
              register_run_id: "{{tasks.register.values.register_run_id}}"
        # La auditoría de rúbrica completa y el ROI se incorporarán en su fase de producto.

    gcc_reset_schema:
      name: gcc_reset_schema
      description: >-
        Borra las tablas (reset_mode=tables) o el esquema completo (reset_mode=schema) para
        probar el job desde un esquema vacío. Exige confirm_reset=<catalog>.<schema>.
      max_concurrent_runs: 1
      tags:
        project: gcc_strength
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: bundle_root
          default: ${workspace.file_path}
        - name: confirm_reset
          default: ""
        - name: reset_mode
          default: tables
      environments:
        - environment_key: medallion
          spec:
            environment_version: "6"
            dependencies:
              - pyyaml==6.0.3
      tasks:
        - task_key: reset_schema
          environment_key: medallion
          notebook_task:
            notebook_path: ./notebooks/99_reset_schema.py

# Un target por integrante. No llevan host ni perfil: se elige la cuenta con -p <perfil>.
targets:
  diego:
    default: true
    mode: development
  # Plantillas: idénticas a diego; cada quien despliega en su cuenta con su perfil.
  ricardo:
    mode: development
  christopher:
    mode: development
