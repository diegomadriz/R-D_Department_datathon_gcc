[project]
name = "gcc-strength"
version = "0.1.0"
description = "Cement strength prediction (R1/R7/R28) for Datathon MICAI 2026, GCC challenge"
# Databricks serverless environment version 6 uses Python 3.12.3
requires-python = "==3.12.*"
# Exact pins match Databricks serverless environment version 6 (standard/ML base), except
# statsmodels, which env 6 does not preinstall (docs/fase0/databricks_capabilities.md).
# lightgbm and shap are not preinstalled either: they are pinned here and declared with the
# same versions in the job environment (databricks.yml). Local-only tooling uses lower bounds;
# uv.lock fixes the exact version.
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.4",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "statsmodels==0.14.5",
    "matplotlib==3.10.6",
    "pyarrow==21.0.0",
    "ipykernel==6.31.0",
    "seaborn>=0.13.2",
    "plotly>=6.0",
    "openpyxl>=3.1.5",
    "jupyter>=1.1.1",
    "tabulate>=0.9",
    "mlflow-skinny==3.12.0",
    "databricks-sdk==0.122.0",
    "lightgbm==4.6.0",
    "shap==0.51.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: `spark`/`dbutils` are runtime globals and imports follow the
# sys.path setup cell.
"notebooks/*.py" = ["F821", "E402", "I001"]
