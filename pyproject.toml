[project]
name = "gcc-strength"
version = "0.1.0"
description = "Cement strength prediction (R1/R7/R28) for Datathon MICAI 2026, GCC challenge"
# Databricks serverless environment version 6 uses Python 3.12.3
requires-python = "==3.12.*"
# Exact pins match Databricks serverless environment version 6 (standard/ML base).
# Packages not shipped in that environment use lower bounds; uv.lock fixes the exact version.
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.4",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "statsmodels==0.14.5",
    "matplotlib==3.10.6",
    "pyarrow==21.0.0",
    "ipykernel==6.31.0",
    "seaborn>=0.13.2",
    "plotly>=6.0",
    "openpyxl>=3.1.5",
    "jupyter>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
